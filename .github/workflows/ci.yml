name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build asm_cat
        run: |
          make clean
          make

      - name: Verify Binary Size
        run: |
          ls -la cat
          echo "Binary size in bytes: $(wc -c < cat)"

      - name: Run Test Suite (Functional, Performance & Size Regressions)
        run: make test
